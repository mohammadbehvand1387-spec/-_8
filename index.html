<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی بی‌زحمت</title>
<style>
  :root { --bg:#fff; --fg:#000; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#fff; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--fg);
    font-family: Vazirmatn, Vazir, Tahoma, system-ui, sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  main { width: 100%; max-width: 720px; display: grid; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-weight: 700; }
  h1 { margin: 0; font-size: 1.5rem; }
  .scores { display: flex; gap: 20px; font-size: 1.1rem; }
  #stage { position: relative; border: 3px solid var(--fg); cursor: pointer; }
  #stage:focus-visible { outline: 4px solid var(--fg); outline-offset: 4px; }
  canvas { display: block; width: 100%; height: auto; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #msg[hidden] { display: none; }
  #msg span {
    padding: 12px 20px; background: var(--bg); border: 3px solid var(--fg);
    font-size: 1.25rem; font-weight: 700; line-height: 1.8; text-align: center;
  }
  p { margin: 0; text-align: center; }
</style>
</head>
<body>
